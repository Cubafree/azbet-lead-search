[phases.setup]
nixPkgs = ["python311", "nodejs_20", "ffmpeg"]

[phases.install]
cmds = [
  "cd frontend && npm install && npm run build && cp -r dist ../backend/static",
  "cd backend && python3.11 -m pip install --upgrade pip && python3.11 -m pip install -r requirements.txt"
]

[start]
cmd = "cd backend && python3.11 -m uvicorn main:app --host 0.0.0.0 --port $PORT"
