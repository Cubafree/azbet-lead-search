[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20", "ffmpeg"]

[phases.install]
cmds = [
  "cd frontend && npm install && npm run build && cp -r dist ../backend/static",
  "python3.11 -m venv /app/.venv",
  "/app/.venv/bin/pip install -r backend/requirements.txt"
]

[start]
cmd = "cd backend && /app/.venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT"
